<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analizador EUR/USD en tiempo real</title>
<style>
:root{--bg:#0e1116;--card:#171b22;--bd:#262c36;--tx:#e6e9ee;--mu:#8b95a5;--up:#26a69a;--dn:#ef5350;--ac:#4c8dff;--wa:#f2b84b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;padding:12px}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--mu);font-size:12px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.card h2{font-size:13px;margin:0 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
label{display:block;font-size:12px;color:var(--mu);margin:6px 0 2px}
input,select,button{width:100%;background:#0b0e13;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px;font-size:14px}
button{cursor:pointer;background:var(--ac);border:0;font-weight:600}
button.sec{background:#2a3140}
.row{display:flex;gap:8px}.row>*{flex:1}
#price{font-size:34px;font-weight:700}
.badge{display:inline-block;padding:6px 14px;border-radius:8px;font-weight:700;font-size:18px}
.BUY{background:rgba(38,166,154,.2);color:var(--up)}.SELL{background:rgba(239,83,80,.2);color:var(--dn)}.WAIT{background:rgba(242,184,75,.15);color:var(--wa)}
canvas{width:100%;height:380px;display:block;background:#0b0e13;border-radius:8px}
table{width:100%;border-collapse:collapse}td{padding:4px 0;border-bottom:1px solid var(--bd)}td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:20px;font-weight:700}
.warn{font-size:12px;color:var(--wa);margin-top:8px}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}
#status{font-size:12px}
</style>
</head>
<body>
<h1>Analizador EUR/USD en tiempo real</h1>
<div class="sub">Velas, indicadores técnicos, plan de operación con riesgo y backtest. Hora mostrada: tu hora local.</div>

<div class="grid">
  <div class="card">
